[project]
name = "flowy"
version = "0.1.0"
description = "Flowy Python monorepo — AI workflows and retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"

[tool.uv.workspace]
members = ["apps/*"]
# packages/* reserved for future shared libraries

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/retrieval-api/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
